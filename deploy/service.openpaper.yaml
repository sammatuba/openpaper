# The web service: Caddy ingress + Next.js client + FastAPI server in one
# Cloud Run service (one origin). Rendered by deploy.sh with envsubst.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: openpaper
  labels:
    app: openpaper
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"caddy":["client","server"]}'
    spec:
      serviceAccountName: ${RUNTIME_SA}
      containerConcurrency: 20
      timeoutSeconds: 600
      containers:
        - name: caddy
          image: ${IMAGE_BASE}/caddy:${TAG}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
        - name: client
          image: ${IMAGE_BASE}/client:${TAG}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 2
            failureThreshold: 60
        - name: server
          image: ${IMAGE_BASE}/server:${TAG}
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 3
            failureThreshold: 60
          env:
            - name: WEB_CONCURRENCY
              value: "1"
            - name: DEBUG
              value: "False"
            - name: CLIENT_DOMAIN
              value: ${PUBLIC_URL}
            - name: API_DOMAIN
              value: ${PUBLIC_URL}
            - name: WEBHOOK_BASE_URL
              value: ${PUBLIC_URL}
            - name: GOOGLE_REDIRECT_URI
              value: ${PUBLIC_URL}/api/auth/google/callback
            - name: SECURE_COOKIES
              value: "true"
            - name: ALLOWED_EMAILS
              value: ${ALLOWED_EMAILS}
            - name: SELF_HOSTED_PLAN
              value: researcher
            - name: LLM_FALLBACK_PROVIDER
              value: ""
            - name: TASK_BACKEND
              value: cloudtasks
            - name: CLOUD_TASKS_PROJECT
              value: ${PROJECT_ID}
            - name: CLOUD_TASKS_LOCATION
              value: ${REGION}
            - name: CLOUD_TASKS_QUEUE
              value: ${QUEUE}
            - name: CLOUD_TASKS_TARGET_URL
              value: ${JOBS_URL}/tasks/run
            - name: CLOUD_TASKS_SERVICE_ACCOUNT
              value: ${RUNTIME_SA}
            - name: AWS_ENDPOINT_URL_S3
              value: ${R2_ENDPOINT}
            - name: AWS_REGION
              value: auto
            # botocore >= 1.36 sends CRC32 request checksums by default; R2
            # wants them only when required (Cloudflare R2 S3 compatibility notes).
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
            - name: S3_BUCKET_NAME
              value: ${R2_BUCKET}
            - name: CLOUDFLARE_BUCKET_NAME
              value: ${R2_PUBLIC_HOST}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_ID
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_SECRET
                  key: latest
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: R2_ACCESS_KEY_ID
                  key: latest
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: R2_SECRET_ACCESS_KEY
                  key: latest
            - name: JOBS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: JOBS_INTERNAL_SECRET
                  key: latest
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ADMIN_SECRET_KEY
                  key: latest
  traffic:
    - percent: 100
      latestRevision: true
