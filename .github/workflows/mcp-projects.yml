name: MCP project operations
on:
  pull_request:
    paths:
      - 'server/app/mcp/project_tools.py'
      - 'server/app/mcp/server.py'
      - 'server/tests/test_mcp_project_tools.py'
      - 'server/tests/test_mcp_projects_database.py'
      - '.github/workflows/mcp-projects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install 'sqlalchemy>=2.0,<3.0'
      - name: Validate Python syntax
        run: python -m compileall -q server/app/mcp/project_tools.py server/app/mcp/server.py server/tests/test_mcp_projects_database.py
      - name: Test project permissions, retries, membership and quotas
        run: python -m unittest discover -s server/tests -p 'test_mcp_projects_database.py' -v
